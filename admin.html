<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Qalam — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="header">
    <div class="header__inner">
        <a href="index.html" class="logo">qalam<span>.</span></a>

        <div class="header__right">
            <div class="lang-switch" role="group" aria-label="Language">
                <button type="button" class="lang-switch__btn" data-lang="kk">ҚАЗ</button>
                <button type="button" class="lang-switch__btn" data-lang="ru">РУС</button>
                <button type="button" class="lang-switch__btn" data-lang="en">ENG</button>
            </div>

            <button type="button" id="logoutBtn" hidden style="cursor:pointer;background:transparent;border:0;font:inherit;color:var(--muted);font-size:12px;font-weight:600;" data-i18n="logout"></button>
        </div>
    </div>
</header>

<!-- LOGIN -->
<div id="loginView">
    <div class="login-box">
        <h1 class="login-box__title" data-i18n="adminLogin"></h1>
        <p class="login-box__sub" data-i18n="adminLoginSub"></p>

        <form id="loginForm" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="username" required>
            </div>
            <div class="field">
                <label for="pw" data-i18n="password"></label>
                <input type="password" id="pw" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block" data-i18n="login"></button>
            <div class="msg" id="loginMsg"></div>
        </form>
    </div>
</div>

<!-- ADMIN -->
<div id="adminView" hidden>
    <div class="admin-page">
        <div class="admin-head">
            <h1 class="admin-title" data-i18n="adminTitle"></h1>
            <div style="display:flex;gap:10px;flex-wrap:wrap;">
                <button type="button" class="btn btn-ghost" id="exportBtn" data-i18n="downloadJson"></button>
                <button type="button" class="btn btn-ghost" id="importBtn" data-i18n="uploadJson"></button>
                <button type="button" class="btn btn-primary" id="addBtn" data-i18n="newTask"></button>
            </div>
        </div>

        <input type="file" id="importFile" accept=".json,application/json" hidden>
        <div class="import-info" id="importInfo" hidden></div>
        <div class="admin-list" id="adminList"></div>

        <!-- EDITOR -->
        <div id="editorView" hidden>
            <div class="editor-card">
                <h2 class="editor-title" id="editorTitle" data-i18n="newTask"></h2>
                <p class="editor-sub">—</p>

                <form id="taskForm" class="form" novalidate>
                    <div class="form-row">
                        <div class="field">
                            <label for="title" data-i18n="taskTitle"></label>
                            <input type="text" id="title" maxlength="100" required>
                        </div>
                        <div class="field">
                            <label for="icon" data-i18n="icon"></label>
                            <input type="text" id="icon" maxlength="2" placeholder="А">
                        </div>
                    </div>

                    <div class="field">
                        <label for="description" data-i18n="description"></label>
                        <input type="text" id="description" maxlength="200">
                    </div>

                    <div class="form-row">
                        <div class="field">
                            <label for="type" data-i18n="taskType"></label>
                            <select id="type">
                                <option value="choice" data-i18n="typeChoice"></option>
                                <option value="letters" data-i18n="typeLetters"></option>
                                <option value="swipe" data-i18n="typeSwipe"></option>
                            </select>
                        </div>

                        <div class="field">
                            <label for="difficulty" data-i18n="difficulty"></label>
                            <select id="difficulty">
                                <option value="easy" data-i18n="levelEasy"></option>
                                <option value="normal" data-i18n="levelNormal"></option>
                                <option value="hard" data-i18n="levelHard"></option>
                            </select>
                        </div>
                    </div>

                    <div>
                        <label style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;display:block;margin-bottom:10px;" data-i18n="questionsLabel"></label>
                        <div class="questions" id="questionsBox"></div>
                        <button type="button" class="btn btn-ghost" id="addQuestionBtn" style="margin-top:12px;" data-i18n="addQuestion"></button>
                    </div>

                    <div class="editor-actions">
                        <button type="button" class="btn btn-ghost" id="cancelEditBtn" data-i18n="cancel"></button>
                        <button type="submit" class="btn btn-primary" data-i18n="save"></button>
                    </div>

                    <div class="msg" id="editorMsg"></div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- IMPORT MODAL -->
<div id="importModal" hidden class="modal">
    <div class="modal__overlay" data-close-modal></div>
    <div class="modal__dialog">
        <h3 class="modal__title" data-i18n="importTitle"></h3>
        <p class="modal__text" id="importModalText" data-i18n="importSub"></p>

        <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">
            <button type="button" class="btn btn-primary btn-block" data-mode="replace" data-i18n="importReplace"></button>
            <button type="button" class="btn btn-outline btn-block" data-mode="append" data-i18n="importAppend"></button>
            <button type="button" class="btn btn-ghost btn-block" data-close-modal data-i18n="cancel"></button>
        </div>

        <div class="msg" id="importMsg" style="margin-top:12px;"></div>
    </div>
</div>

<footer class="footer">
    <div class="footer__inner">
        <a href="index.html" class="logo">qalam<span>.</span></a>
        <span class="footer__text">© 2026 Qalam</span>
    </div>
</footer>

<script src="i18n.js"></script>
<script src="client-api.js"></script>
<script src="admin.js"></script>
</body>
</html>
